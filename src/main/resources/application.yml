spring:
  profiles:
    active: jwt
  datasource:
    url: jdbc:mysql://localhost:3306/user_login_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: kabbo1234
